<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CASTmir</title>
<style>
  :root { --garnet:#782F40; --deep:#5C222D; --gold:#CEB888; --ink:#15181c; --muted:#6b727b; --line:#E6DEDF; --bg:#F6F3F2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  a { color: var(--garnet); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  button { font: inherit; font-weight:600; border-radius:8px; padding:9px 14px; min-height:40px; line-height:1.3; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid #CFC5C7; background:#fff; }
  button.primary { background: var(--garnet); border-color: var(--garnet); color:#fff; }
  input, select { font: inherit; padding:9px 11px; border:1px solid #D8CFD1; border-radius:8px; width:100%; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
</style></head><body>
<div style="width:330px;padding:14px;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:center;gap:9px">
    <div style="width:16px;height:16px;border-radius:5px;background:var(--gold)"></div>
    <b style="font-size:15px">CASTmir</b>
    <span id="state" class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">…</span>
  </div>
  <div class="card" style="display:flex;gap:12px">
    <div style="flex:1"><div style="font-size:11px;color:var(--muted)">Quality</div><div id="q" style="font-size:24px;font-weight:700">—</div></div>
    <div style="flex:1"><div style="font-size:11px;color:var(--muted)">Security</div><div id="s" style="font-size:24px;font-weight:700">—</div></div>
    <div style="flex:1"><div style="font-size:11px;color:var(--muted)">PMI</div><div id="p" style="font-size:24px;font-weight:700">—</div></div>
  </div>
  <div id="msg" style="font-size:12px;color:var(--muted)">Prompts analysed in the last 30 days: <span id="n">0</span></div>
  <div style="display:flex;gap:8px">
    <button class="primary" id="dash" style="flex:1">My dashboard</button>
    <button id="opts">Settings</button>
  </div>
</div>
<script src="popup.js"></script></body></html>
